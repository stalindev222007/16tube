<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>16tube</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font:13px Roboto,Arial,sans-serif;color:#222;background:#f1f1f1}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,textarea{font:inherit}
#top{position:fixed;top:0;left:0;right:0;height:64px;background:#fff;border-bottom:3px solid #00e000;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:10}
#burger i,#burger i:before,#burger i:after{display:block;width:18px;height:2px;background:#606060;position:relative}#burger i:before,#burger i:after{content:'';position:absolute;left:0}#burger i:before{top:-6px}#burger i:after{top:6px}
#burger{border:0;background:none;font-size:22px;cursor:pointer;color:#606060;padding:6px 10px}
#logo img{height:54px;display:block}
#search{flex:1;max-width:640px;margin:0 auto;display:flex}
#search input{flex:1;min-width:0;height:30px;border:1px solid #ccc;border-right:0;padding:0 8px;box-shadow:inset 0 1px 2px #eee;font-size:15px}
#search button{width:64px;height:30px;border:1px solid #d3d3d3;background:#f8f8f8;cursor:pointer;font-size:15px;color:#555}
#upbtn{background:#00e000;color:#000;border:1px solid #000!important;border:0;border-radius:2px;height:34px;padding:0 16px;font-weight:500;cursor:pointer;white-space:nowrap}
#upbtn:hover{background:#00c000}
#side{position:fixed;top:64px;bottom:0;left:0;width:210px;background:#fff;border-right:1px solid #e2e2e2;padding:12px 0;overflow:auto}
#side a{display:flex;gap:16px;align-items:center;height:36px;padding:0 24px;font-size:14px;color:#222}
#side a:hover{background:#eee}
#side a.on{background:#e6ffe6;font-weight:500;color:#007a00;box-shadow:inset 3px 0 #00e000}
#side small{display:block;padding:14px 24px;color:#767676;line-height:1.4;border-top:1px solid #e2e2e2;margin-top:10px}
#app{margin:64px 0 0 210px;padding:20px 24px}
body.nosb #side{display:none}body.nosb #app{margin-left:0}
h2{font-size:16px;font-weight:500;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px 14px}
.card .th{position:relative;aspect-ratio:16/9;background:#222;display:block}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.dur,.pdur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:2px}
.card .t{display:block;font-size:14px;font-weight:500;margin:8px 0 3px;line-height:1.3;max-height:2.6em;overflow:hidden}
.card .m{color:#767676;line-height:1.4}
.card .m b{font-weight:400;color:#767676}
.card:hover .t{color:#000;text-decoration:underline}
.empty{background:#fff;border:1px solid #e2e2e2;padding:48px 20px;text-align:center;color:#555;line-height:1.7;font-size:14px}
.watch{display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0}
.rel{width:340px;flex:none}
.rel .card{display:flex;gap:8px;margin-bottom:10px}
.rel .th{width:168px;flex:none}
.rel .t{margin-top:0;font-size:13px}
video{width:100%;background:#000;display:block;max-height:75vh}
.box{background:#fff;border:1px solid #e2e2e2;border-top:0;padding:14px 16px}
.main h1{font-size:18px;font-weight:400;margin:0 0 10px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid #e2e2e2;padding-bottom:12px}
.who{display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px}
.ava{width:40px;height:40px;border-radius:50%;background:#00e000;color:#000;border:1px solid #000;display:grid;place-items:center;font-weight:700;font-size:16px}
.views{font-size:18px;text-align:right;color:#222}
.act{display:flex;gap:8px;align-items:center;margin-top:6px;justify-content:flex-end}
.btn{height:28px;padding:0 10px;border:1px solid #d3d3d3;background:#f8f8f8;border-radius:2px;color:#555;font-weight:500;cursor:pointer}
.btn:hover{background:#eee;border-color:#c6c6c6}
.btn.on{color:#007a00;border-color:#00a000;background:#e6ffe6}
.desc{padding:14px 0;line-height:1.5;white-space:pre-wrap;color:#333}
.desc small{display:block;color:#767676;margin-bottom:6px}
.cm{display:flex;gap:10px;margin:14px 0}
.cm .ava{width:32px;height:32px;font-size:13px;background:#00e000}
.cm p{margin:2px 0 0;line-height:1.4;white-space:pre-wrap}
.cm span{color:#767676;font-size:12px;margin-left:6px}
#cin{width:100%;border:1px solid #ccc;padding:8px;resize:vertical;min-height:54px}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:30}
#mask.on{display:grid}
#modal{background:#fff;width:min(520px,94vw);box-shadow:0 4px 24px rgba(0,0,0,.4)}
#modal header{padding:14px 18px;border-bottom:1px solid #e2e2e2;font-size:16px;font-weight:500;display:flex;justify-content:space-between}
#modal header a{color:#767676;font-size:20px;line-height:1}
#modal form{padding:18px;display:grid;gap:12px}
#drop{border:2px dashed #bbb;padding:28px 12px;text-align:center;color:#555;cursor:pointer;background:#fafafa}
#drop.hot{border-color:#00c000;background:#f0fff0}
#modal input[type=text],#modal textarea{width:100%;border:1px solid #ccc;padding:7px 8px}
#modal textarea{min-height:70px;resize:vertical}
#msg{color:#767676;min-height:1.2em}
.pub{background:#00e000;color:#000;border:1px solid #000;height:34px;border-radius:2px;font-weight:500;cursor:pointer}
.pub:disabled{background:#ccc;color:#666;border-color:#aaa;cursor:default}
@media(max-width:900px){#side{display:none}#app{margin-left:0;padding:14px 10px}.watch{flex-direction:column}.rel{width:100%}#logo img{height:40px}}
@media(max-width:560px){#upbtn{padding:0 10px}#search button{width:56px;font-size:13px}}
#acc{height:34px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mask2{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:40}#mask2.on{display:grid}
#modal2{background:#fff;width:min(400px,94vw);box-shadow:0 4px 24px rgba(0,0,0,.4)}
#modal2 header{padding:14px 18px;border-bottom:1px solid #e2e2e2;font-size:16px;font-weight:500;display:flex;justify-content:space-between}
#modal2 header a{color:#767676;font-size:20px;line-height:1}
#modal2 form{padding:18px;display:grid;gap:12px}
#modal2 input{width:100%;border:1px solid #ccc;padding:7px 8px}
.tabs{display:flex;border-bottom:1px solid #e2e2e2}.tabs a{flex:1;text-align:center;padding:10px;color:#767676;font-weight:500}.tabs a.on{color:#222;border-bottom:2px solid #00e000}
.err{color:#cc181e;min-height:1.2em}.lab{display:grid;gap:4px;color:#555}
</style>
</head>
<body>
<div id="top">
  <button id="burger" aria-label="Меню"><i></i></button>
  <a id="logo" href="#/"><img src="logo.png" alt="16tube"></a>
  <form id="search"><input id="q" type="text" placeholder="Поиск" autocomplete="off"><button aria-label="Найти">Поиск</button></form>
  <button id="upbtn">Добавить видео</button>
  <button id="acc" class="btn"></button>
</div>
<nav id="side">
  <a href="#/" data-r="home">Главная</a>
  <a href="#/trending" data-r="trending">В тренде</a>
  <a href="#/history" data-r="history">История</a>
  <a href="#/liked" data-r="liked">Понравившиеся</a>
  <small>Аккаунты и видео хранятся только в твоём браузере. Другим людям они не видны.</small>
</nav>
<main id="app"></main>

<div id="mask2"><div id="modal2"></div></div>
<div id="mask">
  <div id="modal">
    <header>Добавить видео <a id="x" aria-label="Закрыть">×</a></header>
    <form id="uf">
      <div id="drop">Перетащи видео сюда или нажми, чтобы выбрать файл<input id="file" type="file" accept="video/*" hidden></div>
      <label class="lab">Своё превью (необязательно)<input id="uth" type="file" accept="image/*"></label>
      <input id="ut" type="text" placeholder="Название" maxlength="100" required>
      <textarea id="ud" placeholder="Описание"></textarea>
      <div id="msg"></div>
      <button class="pub" id="pub" disabled>Опубликовать</button>
    </form>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- аккаунты (localStorage) ---------- */
const accs=()=>{try{return JSON.parse(localStorage.t16a||'[]')}catch(e){return[]}};
const saveAccs=a=>localStorage.t16a=JSON.stringify(a);
const me=()=>accs().find(a=>a.id===localStorage.t16s)||null;
const nameOf=id=>(accs().find(a=>a.id===id)||{name:'Удалённый аккаунт'}).name;
const av=id=>esc((nameOf(id)[0]||'?').toUpperCase());
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hk=()=>'t16h'+((me()||{}).id||'');
async function sha(t){if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return'w'+h}
const liked=v=>{const u=me();return !!u&&(v.lk||[]).includes(u.id)};
const imgThumb=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{const c=document.createElement('canvas');c.width=640;c.height=360;const g=c.getContext('2d'),r=Math.max(640/i.width,360/i.height),w=i.width*r,h=i.height*r;
    g.drawImage(i,(640-w)/2,(360-h)/2,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85))};
  i.onerror=()=>no(new Error('Не удалось прочитать картинку'));i.src=u});

/* ---------- IndexedDB: 'v' = метаданные, 'b' = сами файлы ---------- */
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('16tube',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('v',{keyPath:'id'});r.result.createObjectStore('b',{keyPath:'id'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function tx(store,mode,fn){const d=await dbp;return new Promise((ok,no)=>{
  const t=d.transaction(store,mode);const rq=fn(t.objectStore(store));
  t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>no(t.error)})}
const allV=()=>tx('v','readonly',s=>s.getAll());
const getV=id=>tx('v','readonly',s=>s.get(id));
const putV=v=>tx('v','readwrite',s=>s.put(v));
const getB=id=>tx('b','readonly',s=>s.get(id));
async function delV(id){await tx('v','readwrite',s=>s.delete(id));await tx('b','readwrite',s=>s.delete(id))}
const hist=()=>{try{return JSON.parse(localStorage[hk()]||'[]')}catch(e){return[]}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ---------- форматирование ---------- */
const pr=new Intl.PluralRules('ru');
const plural=(n,a,b,c)=>{const k=pr.select(n);return n+' '+(k==='one'?a:k==='few'?b:c)};
const views=n=>plural(n,'просмотр','просмотра','просмотров');
const dur=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
function ago(t){const s=(Date.now()-t)/1000;
  if(s<60)return'только что';
  if(s<3600)return plural(Math.floor(s/60),'минуту','минуты','минут')+' назад';
  if(s<86400)return plural(Math.floor(s/3600),'час','часа','часов')+' назад';
  if(s<2592000)return plural(Math.floor(s/86400),'день','дня','дней')+' назад';
  if(s<31536000)return plural(Math.floor(s/2592000),'месяц','месяца','месяцев')+' назад';
  return plural(Math.floor(s/31536000),'год','года','лет')+' назад'}

/* ---------- карточки ---------- */
const card=v=>`<a class="card" href="#/watch/${v.id}"><span class="th"><img src="${v.thumb}" alt=""><span class="dur">${dur(v.dur)}</span></span>
<span class="t">${esc(v.title)}</span><span class="m">${esc(nameOf(v.o))}<br>${views(v.views)} • ${ago(v.date)}</span></a>`;
const list=(vs,empty)=>vs.length?`<div class="grid">${vs.map(card).join('')}</div>`:`<div class="empty">${empty}</div>`;
const emptyHome='Здесь пока пусто.<br>Нажми «Добавить видео» вверху справа и загрузи свой первый ролик.';

/* ---------- роутер ---------- */
let curUrl=null;
async function route(){
  if(curUrl){URL.revokeObjectURL(curUrl);curUrl=null}
  const h=location.hash.replace(/^#\/?/,'');const [r,arg]=h.split('/');
  document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.r===(r||'home')));
  const app=$('#app');const vs=(await allV()).sort((a,b)=>b.date-a.date);
  scrollTo(0,0);
  if(r==='watch')return watch(arg,vs);
  if(r==='trending')app.innerHTML='<h2>В тренде</h2>'+list([...vs].sort((a,b)=>b.views-a.views),'Пока нет видео.');
  else if(r==='liked')app.innerHTML='<h2>Понравившиеся</h2>'+list(vs.filter(liked),'Ты ещё ничего не лайкнул.');
  else if(r==='history'){const m=Object.fromEntries(vs.map(v=>[v.id,v]));
    app.innerHTML='<h2>История просмотров</h2>'+list(hist().map(i=>m[i]).filter(Boolean),'История пуста.')}
  else if(r==='q'){const q=decodeURIComponent(arg||'').toLowerCase();
    app.innerHTML=`<h2>Результаты поиска: ${esc(q)}</h2>`+list(vs.filter(v=>(v.title+' '+v.desc).toLowerCase().includes(q)),'Ничего не найдено.')}
  else app.innerHTML='<h2>Рекомендуемое</h2>'+list(vs,emptyHome);
}
async function watch(id,vs){
  const v=await getV(id),app=$('#app');
  if(!v){app.innerHTML='<div class="empty">Видео не найдено. Возможно, оно удалено.</div>';return}
  const b=await getB(id);
  if(!b){app.innerHTML='<div class="empty">Файл видео потерян (браузер мог очистить данные сайта).</div>';return}
  curUrl=URL.createObjectURL(b.blob);
  v.views++;await putV(v);
  localStorage[hk()]=JSON.stringify([id,...hist().filter(i=>i!==id)].slice(0,100));
  const draw=()=>{
    const u=me(),own=!!u&&u.id===v.o;
    $('#app').innerHTML=`<div class="watch"><div class="main">
    <video src="${curUrl}" controls autoplay playsinline></video>
    <div class="box"><h1>${esc(v.title)}</h1>
    <div class="bar"><div class="who"><div class="ava">${av(v.o)}</div>${esc(nameOf(v.o))}</div>
      <div><div class="views">${views(v.views)}</div>
      <div class="act"><button class="btn ${liked(v)?'on':''}" id="lk">${liked(v)?'Нравится':'Мне нравится'}</button>${own?'<button class="btn" id="th">Сменить превью</button><button class="btn" id="dl">Удалить</button><input id="thf" type="file" accept="image/*" hidden>':''}</div></div></div>
    <div class="desc"><small>Опубликовано ${new Date(v.date).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</small>${esc(v.desc)||'<i style="color:#767676">Без описания</i>'}</div>
    <div class="bar" style="border:0;padding:0"><b>${plural((v.comments||[]).length,'комментарий','комментария','комментариев')}</b></div>
    <textarea id="cin" placeholder="Оставить комментарий"></textarea>
    <div style="margin:8px 0 14px"><button class="btn" id="cs">Комментировать</button></div>
    ${(v.comments||[]).slice().reverse().map(c=>`<div class="cm"><div class="ava">${av(c.u||v.o)}</div><div><b>${esc(nameOf(c.u||v.o))}</b><span>${ago(c.t)}</span><p>${esc(c.x)}</p></div></div>`).join('')}
    </div></div>
    <aside class="rel"><h2>Следующее</h2>${vs.filter(x=>x.id!==id).slice(0,12).map(card).join('')||'<div class="empty">Других видео нет.</div>'}</aside></div>`;
    $('#lk').onclick=async()=>{const m=me();if(!m)return authDlg('in');const a=v.lk=v.lk||[],i=a.indexOf(m.id);i<0?a.push(m.id):a.splice(i,1);await putV(v);keep(draw)};
    if(own){$('#th').onclick=()=>$('#thf').click();$('#thf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{v.thumb=await imgThumb(f);await putV(v);keep(draw)}catch(err){alert(err.message)}}}
    if(own)$('#dl').onclick=async()=>{if(confirm('Удалить это видео навсегда?')){await delV(id);location.hash='#/'}};
    $('#cs').onclick=async()=>{const x=$('#cin').value.trim();if(!me())return authDlg('in');if(!x)return;(v.comments=v.comments||[]).push({x,u:me().id,t:Date.now()});await putV(v);keep(draw)};
  };
  const keep=f=>{const o=$('video'),t=o.currentTime,p=o.paused;f();const n=$('video');n.currentTime=t;if(p)n.pause()};
  draw();
}
addEventListener('hashchange',route);

/* ---------- интерфейс ---------- */
$('#burger').onclick=()=>document.body.classList.toggle('nosb');
$('#search').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();location.hash=q?'#/q/'+encodeURIComponent(q):'#/'};

/* ---------- окна аккаунта ---------- */
const m2=$('#mask2'),d2=$('#modal2'),close2=()=>m2.classList.remove('on');
m2.onmousedown=e=>{if(e.target===m2)close2()};
function hdr(){const u=me(),b=$('#acc');b.textContent=u?u.name:'Войти';b.onclick=()=>u?setDlg():authDlg('in')}
function authDlg(tab){
  d2.innerHTML=`<header>Аккаунт <a id="x2">×</a></header><div class="tabs"><a data-t="in" class="${tab==='in'?'on':''}">Вход</a><a data-t="up" class="${tab==='up'?'on':''}">Регистрация</a></div>
  <form id="af"><input id="an" type="text" placeholder="Имя аккаунта" maxlength="30" required autocomplete="username"><input id="ap" type="password" placeholder="Пароль" required autocomplete="${tab==='in'?'current-password':'new-password'}">${tab==='up'?'<input id="ap2" type="password" placeholder="Повтори пароль" required autocomplete="new-password">':''}<div class="err" id="ae"></div><button class="pub">${tab==='in'?'Войти':'Создать аккаунт'}</button></form>`;
  m2.classList.add('on');$('#x2').onclick=close2;
  d2.querySelectorAll('.tabs a').forEach(a=>a.onclick=()=>authDlg(a.dataset.t));
  $('#af').onsubmit=async e=>{e.preventDefault();const n=$('#an').value.trim(),pw=$('#ap').value,A=accs(),er=$('#ae');
    const found=A.find(a=>a.name.toLowerCase()===n.toLowerCase());
    if(tab==='up'){
      if(found){er.textContent='Такое имя уже занято.';return}
      if(pw.length<4){er.textContent='Пароль: минимум 4 символа.';return}
      if(pw!==$('#ap2').value){er.textContent='Пароли не совпадают.';return}
      const salt=rid(),a={id:rid(),name:n,salt,hash:await sha(salt+pw)};A.push(a);saveAccs(A);localStorage.t16s=a.id;
      for(const v of await allV())if(!v.o){v.o=a.id;await putV(v)}
    }else{
      if(!found||found.hash!==await sha(found.salt+pw)){er.textContent='Неверное имя или пароль.';return}
      localStorage.t16s=found.id}
    close2();hdr();route()}}
function setDlg(){const u=me();
  d2.innerHTML=`<header>Мой аккаунт <a id="x2">×</a></header><form id="sf"><label class="lab">Имя аккаунта<input id="sn" type="text" maxlength="30" value="${esc(u.name)}" required></label><div class="err" id="se"></div><button class="pub">Сохранить имя</button><button type="button" class="btn" id="lo" style="height:34px">Выйти из аккаунта</button></form>`;
  m2.classList.add('on');$('#x2').onclick=close2;
  $('#sf').onsubmit=e=>{e.preventDefault();const n=$('#sn').value.trim(),A=accs();
    if(A.some(a=>a.id!==u.id&&a.name.toLowerCase()===n.toLowerCase())){$('#se').textContent='Такое имя уже занято.';return}
    A.find(a=>a.id===u.id).name=n;saveAccs(A);close2();hdr();route()};
  $('#lo').onclick=()=>{localStorage.removeItem('t16s');close2();hdr();location.hash='#/';route()}}

/* ---------- загрузка ---------- */
let pick=null;
const mask=$('#mask'),msg=$('#msg');
const openUp=()=>{mask.classList.add('on')},closeUp=()=>{mask.classList.remove('on')};
function setFile(f){
  if(!f||!f.type.startsWith('video/')){msg.textContent='Нужен видеофайл.';return}
  pick=f;$('#drop').firstChild.textContent='Выбран файл: '+f.name;
  if(!$('#ut').value)$('#ut').value=f.name.replace(/\.[^.]+$/,'');
  $('#pub').disabled=false;msg.textContent=(f.size/1048576).toFixed(1)+' МБ'}
$('#upbtn').onclick=()=>me()?openUp():authDlg('up');$('#x').onclick=closeUp;
mask.onmousedown=e=>{if(e.target===mask)closeUp()};
$('#drop').onclick=()=>$('#file').click();
$('#file').onchange=e=>setFile(e.target.files[0]);
['dragover','dragenter'].forEach(n=>$('#drop').addEventListener(n,e=>{e.preventDefault();$('#drop').classList.add('hot')}));
['dragleave','drop'].forEach(n=>$('#drop').addEventListener(n,e=>{e.preventDefault();$('#drop').classList.remove('hot')}));
$('#drop').addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));

function probe(file){return new Promise(ok=>{
  const u=URL.createObjectURL(file),v=document.createElement('video');
  v.muted=true;v.preload='metadata';v.playsInline=true;v.src=u;
  const done=(th,d)=>{URL.revokeObjectURL(u);ok({thumb:th,dur:d})};
  const fallback=()=>{const c=document.createElement('canvas');c.width=320;c.height=180;const g=c.getContext('2d');
    g.fillStyle='#333';g.fillRect(0,0,320,180);return c.toDataURL('image/jpeg')};
  v.onerror=()=>done(fallback(),0);
  v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};
  v.onseeked=()=>{try{const c=document.createElement('canvas');c.width=320;c.height=180;
    c.getContext('2d').drawImage(v,0,0,320,180);done(c.toDataURL('image/jpeg',.8),v.duration)}catch(e){done(fallback(),v.duration)}};
  setTimeout(()=>done(fallback(),v.duration||0),8000)})}

$('#uf').onsubmit=async e=>{
  e.preventDefault();if(!pick)return;if(!me())return authDlg('in');
  $('#pub').disabled=true;msg.textContent='Сохраняю…';
  try{
    const p=await probe(pick),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await tx('b','readwrite',s=>s.put({id,blob:pick}));
    await putV({id,title:$('#ut').value.trim()||'Без названия',desc:$('#ud').value,date:Date.now(),views:0,lk:[],comments:[],o:me().id,thumb:$('#uth').files[0]?await imgThumb($('#uth').files[0]):p.thumb,dur:p.dur});
    pick=null;$('#uf').reset();$('#drop').firstChild.textContent='Перетащи видео сюда или нажми, чтобы выбрать файл';msg.textContent='';
    closeUp();location.hash='#/watch/'+id;
  }catch(err){msg.textContent='Не удалось сохранить: '+(err.name==='QuotaExceededError'?'в браузере закончилось место.':err.message);$('#pub').disabled=false}
};
hdr();route();
</script>
